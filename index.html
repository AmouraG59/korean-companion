<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#244b3c"><meta name="description" content="Your personal Korean learning companion">
<link rel="manifest" href="manifest.webmanifest">
<title>Korean Companion</title>
<style>
:root{--green:#244b3c;--green2:#426b52;--cream:#f8f6ef;--sage:#e9ede5;--ink:#26352d;--muted:#78847c;--white:#fff;--line:#e7e7df;--gold:#d8ad59}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100dvh;padding-bottom:90px}.top{padding:22px 20px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;color:var(--green);font-size:18px}.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:3px}.avatar{width:42px;height:42px;border-radius:50%;background:var(--sage);display:grid;place-items:center;font-size:22px}.page{padding:8px 20px 24px}.eyebrow{font-size:10px;letter-spacing:1.7px;font-weight:800;color:var(--green2)}h1{font-size:30px;line-height:1.12;margin:8px 0;color:var(--green)}h2{font-size:20px;color:var(--green);margin:25px 0 12px}p{line-height:1.55;color:var(--muted);margin:7px 0}.hero{background:var(--green);color:white;border-radius:23px;padding:22px;margin:16px 0}.hero h2{color:white;font-size:23px;margin:8px 0}.hero p{color:#dce7dd}.btn{border:0;border-radius:13px;padding:13px 16px;background:var(--green);color:white;font-weight:750}.btn.light{background:#f5f4ec;color:var(--green)}.btn.ghost{background:var(--sage);color:var(--green)}.btn:disabled{opacity:.45}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:17px;margin:10px 0}.muted{color:var(--muted);font-size:13px}.progress{height:8px;background:#d9e0d7;border-radius:20px;overflow:hidden;margin:13px 0 7px}.progress span{display:block;height:100%;background:var(--green2);width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;text-align:left;color:var(--ink)}.tile strong{display:block;color:var(--green);margin:7px 0}.tile .emoji{font-size:24px}.pill{font-size:10px;font-weight:800;letter-spacing:.7px;color:var(--green2);background:var(--sage);border-radius:20px;padding:6px 9px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:flex;justify-content:space-around;background:#fffefa;border-top:1px solid var(--line);padding:10px 5px calc(10px + env(safe-area-inset-bottom));z-index:4}.nav button{border:0;background:none;color:var(--muted);font-size:11px;padding:5px}.nav button.active{color:var(--green);font-weight:800}.nav span{display:block;font-size:20px;margin-bottom:3px}.lettergrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0}.letter{border:1px solid var(--line);border-radius:14px;background:white;padding:15px 5px;font-size:28px;color:var(--green);font-weight:800}.letter.selected{background:var(--sage);border:2px solid var(--green2)}.answer{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:white;padding:14px;margin:9px 0;color:var(--ink)}.answer.selected{border:2px solid var(--green2);background:var(--sage)}.feedback{padding:13px;border-radius:13px;background:var(--sage);margin-top:12px;line-height:1.5}.chat{display:flex;flex-direction:column;gap:10px;min-height:240px;max-height:48dvh;overflow:auto;padding:5px 0}.bubble{max-width:88%;padding:12px 14px;border-radius:16px;line-height:1.5;font-size:14px}.bot{background:white;border:1px solid var(--line);align-self:flex-start}.user{background:var(--green);color:white;align-self:flex-end}.chatcontrols{display:flex;gap:8px}.chatcontrols input{min-width:0;flex:1;border:1px solid var(--line);border-radius:13px;padding:12px;background:white}.small{font-size:11px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center}.hidden{display:none!important}.tag{font-size:11px;color:var(--muted)}.dialect{display:flex;gap:12px;align-items:center}.dialect .emoji{font-size:27px}.dialect div:nth-child(2){flex:1}.setting{padding:13px 0;border-bottom:1px solid var(--line)}select{border:1px solid var(--line);border-radius:10px;padding:9px;background:white;color:var(--ink)}.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#1d3429;color:white;padding:10px 16px;border-radius:12px;z-index:9;display:none}
</style>
</head>
<body><div class="toast" id="toast"></div><div class="app">
<header class="top"><div class="brand">한국어 · KOREAN COMPANION<small>YOUR PERSONAL KOREAN COACH</small></div><div class="avatar">🇰🇷</div></header>
<main class="page" id="view"></main>
<nav class="nav">
<button data-tab="home" class="active"><span>⌂</span>Home</button><button data-tab="learn"><span>📚</span>Learn</button><button data-tab="practice"><span>🎙️</span>Practice</button><button data-tab="dialects"><span>🗺️</span>Dialects</button><button data-tab="profile"><span>◉</span>Profile</button>
</nav></div>
<script>
const $=s=>document.querySelector(s);
const lessons=[
{id:'hangul',title:'Meet Hangul',cat:'FOUNDATIONS',desc:'Learn the Korean writing system.',time:'10 min',icon:'🔤'},
{id:'sounds',title:'Consonants & vowels',cat:'PRONUNCIATION',desc:'Build syllables and hear sound changes.',time:'15 min',icon:'🎧'},
{id:'greetings',title:'First conversations',cat:'VOCABULARY',desc:'Greetings, introductions and polite phrases.',time:'10 min',icon:'👋'},
{id:'particles',title:'Sentence building',cat:'GRAMMAR',desc:'Understand Korean word order and particles.',time:'15 min',icon:'🧩'},
{id:'verbs',title:'Useful verb endings',cat:'GRAMMAR',desc:'Present, past and polite speech.',time:'15 min',icon:'✍️'},
{id:'daily',title:'Everyday situations',cat:'CONVERSATION',desc:'Cafes, directions, shopping and friends.',time:'20 min',icon:'☕'}
];
const dialects=[
['표준어','Standard Korean','Seoul & Gyeonggi','🏙️','Foundation for communication across Korea.'],
['경상도 사투리','Gyeongsang','Busan, Daegu & southeast','🌊','Distinctive intonation and sentence endings.'],
['전라도 사투리','Jeolla','Gwangju & southwest','🌾','Regional vocabulary and expressive patterns.'],
['충청도 사투리','Chungcheong','Daejeon & central-west','🌳','Local endings and varied speech rhythms.'],
['강원도 방언','Gangwon','Gangwon region','⛰️','Local varieties across the east and inland areas.'],
['제주어','Jeju language variety','Jeju Island','🌴','A highly distinctive variety with its own vocabulary and grammar.']
];
const initial={tab:'home',done:[],xp:0,streak:1,quizCorrect:0,quizAttempts:0,history:[],nickname:'Learner',correction:'after',personality:'friendly',english:'adaptive'};
let state={...initial,...JSON.parse(localStorage.getItem('kc-state')||'{}')};
function save(){localStorage.setItem('kc-state',JSON.stringify(state))}
function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function go(tab){state.tab=tab;save();render();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function progress(){return Math.round(state.done.length/lessons.length*100)}
function home(){return `<div class="eyebrow">YOUR KOREAN JOURNEY</div><h1>안녕하세요${state.nickname==='Learner'?'':' , '+state.nickname}!</h1><p>Small steps become confident conversations.</p>
<div class="hero"><div class="eyebrow" style="color:#c5d8c8">YOUR PERSONAL LEARNING SPACE</div><h2>오늘도 한국어를 배워 봐요!</h2><p>Let's learn Korean today. Your next conversation starts with one phrase.</p><button class="btn light" onclick="go('practice')">Talk with your tutor →</button></div>
<div class="card"><div class="row between"><b>Your learning progress</b><span class="pill">BEGINNER</span></div><div class="progress"><span style="width:${progress()}%"></span></div><div class="row between"><span class="muted">${state.done.length} of ${lessons.length} core lessons completed</span><b style="color:var(--green)">${progress()}%</b></div></div>
<div class="sectionhead"><h2>Pick up where you left off</h2><button class="tag" onclick="go('learn')">All lessons →</button></div>
<div class="grid">${lessons.slice(0,4).map(l=>`<button class="tile" onclick="openLesson('${l.id}')"><span class="emoji">${l.icon}</span><strong>${l.title}</strong><span class="muted">${l.time} · ${state.done.includes(l.id)?'Completed':'Start lesson →'}</span></button>`).join('')}</div>
<h2>Quick practice</h2><div class="card row between"><div><b>Say one sentence out loud</b><p class="muted">Practice with your speaking coach.</p></div><button class="btn" onclick="go('practice')">Practice</button></div>`}
function learn(){return `<div class="eyebrow">YOUR CURRICULUM</div><h1>Learning path</h1><p>Build a strong standard-Korean foundation before exploring regional speech.</p>${lessons.map((l,i)=>`<button class="tile" style="width:100%;margin:6px 0;display:flex;gap:13px;align-items:center" onclick="openLesson('${l.id}')"><span class="emoji">${l.icon}</span><span style="flex:1;text-align:left"><span class="tag">${l.cat} · ${l.time}</span><strong>${l.title}</strong><span class="muted">${l.desc}</span></span><b>${state.done.includes(l.id)?'✓':'→'}</b></button>`).join('')}`}
function openLesson(id){state.current=id;save();renderLesson(id)}
function renderLesson(id){let l=lessons.find(x=>x.id===id);let body='';
if(id==='hangul')body=`<p>Hangul is written in syllable blocks. Tap a consonant to inspect it.</p><div class="lettergrid">${[['ㄱ','기역','g/k'],['ㄴ','니은','n'],['ㄷ','디귿','d/t'],['ㄹ','리을','r/l'],['ㅁ','미음','m'],['ㅂ','비읍','b/p'],['ㅅ','시옷','s'],['ㅇ','이응','silent/ng'],['ㅈ','지읒','j'],['ㅊ','치읓','ch'],['ㅋ','키읔','k'],['ㅌ','티읕','t'],['ㅍ','피읖','p'],['ㅎ','히읗','h']].map(a=>`<button class="letter" onclick="inspectLetter('${a[0]}','${a[1]}','${a[2]}',this)">${a[0]}</button>`).join('')}</div><div class="feedback" id="letterInfo">Choose a letter to see its name and an approximate sound. Sounds vary by position and context.</div><h3>Try reading</h3><div class="grid">${[['가','ga'],['나','na'],['모','mo'],['한','han']].map(a=>`<button class="tile" onclick="speak('${a[0]}')"><strong style="font-size:28px">${a[0]}</strong><span class="muted">${a[1]} · 🔊 Listen</span></button>`).join('')}</div>`;
if(id==='sounds')body=`<p>Korean consonants can sound different depending on where they appear. Listen and repeat.</p>${[['가','ga / ka'],['나','na'],['다','da / ta'],['라','ra / la'],['마','ma'],['바','ba / pa']].map(a=>`<button class="answer" onclick="speak('${a[0]}')"><b style="font-size:24px">${a[0]}</b>　${a[1]}　🔊</button>`).join('')}<div class="feedback">Tip: ㄹ is not exactly English R or L. Listen to native audio and practice in syllables.</div>`;
if(id==='greetings')body=`<p>Polite expressions you'll hear every day.</p>${[['안녕하세요','Hello'],['감사합니다','Thank you'],['네','Yes'],['아니요','No'],['죄송합니다','I’m sorry'],['만나서 반가워요','Nice to meet you']].map(a=>`<button class="answer" onclick="speak('${a[0]}')"><b>${a[0]}</b><br><span class="muted">${a[1]} · 🔊 Tap to hear</span></button>`).join('')}`;
if(id==='particles')body=`<p>Korean commonly uses subject–object–verb order. The verb usually comes at the end.</p><div class="feedback"><b>저는 물을 마셔요.</b><br>저는 = as for me · 물을 = water (object) · 마셔요 = drink<br><b>Natural translation:</b> I drink water.</div><p>Particles mark the role of a word. 은/는 marks the topic; 을/를 marks the object.</p>`;
if(id==='verbs')body=`<p>Polite 요-style speech is a useful everyday starting point.</p><div class="feedback"><b>가다</b> (to go) → <b>가요</b> (go / am going)<br><b>먹다</b> (to eat) → <b>먹어요</b> (eat / am eating)<br><b>하다</b> (to do) → <b>해요</b> (do / am doing)</div><p>These are common forms, but conjugation has patterns and exceptions we'll learn gradually.</p>`;
if(id==='daily')body=`<p>Start a cafe interaction.</p><div class="feedback"><b>아메리카노 한 잔 주세요.</b><br>One Americano, please.<br><br><b>얼마예요?</b><br>How much is it?</div><button class="btn" onclick="speak('아메리카노 한 잔 주세요. 얼마예요?')">🔊 Hear the phrases</button>`;
$('#view').innerHTML=`<button class="tag" onclick="go('learn')">← Back to lessons</button><div class="eyebrow" style="margin-top:18px">${l.cat} · ${l.time}</div><h1>${l.title}</h1><p>${l.desc}</p><div class="card">${body}<button class="btn" style="width:100%;margin-top:18px" onclick="completeLesson('${id}')">${state.done.includes(id)?'Completed ✓':'Mark lesson complete'}</button></div>`}
function inspectLetter(letter,name,sound,el){document.querySelectorAll('.letter').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');$('#letterInfo').innerHTML=`<b style="font-size:25px">${letter} · ${name}</b><br>Approximate sound: ${sound}<br><span class="small">This is a learning approximation, not an exact English equivalent.</span>`;speak(letter)}
function completeLesson(id){if(!state.done.includes(id)){state.done.push(id);state.xp+=20;state.history.unshift({type:'lesson',title:lessons.find(x=>x.id===id).title,date:new Date().toLocaleDateString()});save()}toast('Lesson progress saved! 잘했어요!');go('learn')}
function quiz(){let qs=[{q:'What does 안녕하세요 mean?',a:['Goodbye','Hello','Thank you','Good night'],correct:1,why:'안녕하세요 is a polite, everyday greeting meaning “Hello.”'},{q:'Which particle marks the object?',a:['은/는','이/가','을/를','에'],correct:2,why:'을/를 marks the object of a verb.'},{q:'Where does the verb usually go in a Korean sentence?',a:['First','In the middle','At the end','Anywhere'],correct:2,why:'Korean is typically subject–object–verb (SOV).'}];let q=qs[state.qIndex||0];return `<div class="eyebrow">KNOWLEDGE CHECK</div><h1>Quick quiz</h1><p>One question at a time. Take your time.</p><div class="card"><span class="pill">QUESTION ${(state.qIndex||0)+1} OF ${qs.length}</span><h2 style="margin-top:17px">${q.q}</h2><div id="answers">${q.a.map((a,i)=>`<button class="answer" onclick="chooseAnswer(${i})">${a}</button>`).join('')}</div><div id="quizFeedback"></div><button class="btn" style="width:100%;margin-top:12px" id="nextQ" disabled onclick="nextQuestion()">${(state.qIndex||0)===qs.length-1?'Finish quiz':'Next question'}</button></div><p class="muted">Quiz results are saved on this device.</p>`}
window.chooseAnswer=i=>{let q=[{correct:1,why:'안녕하세요 is a polite, everyday greeting meaning “Hello.”'},{correct:2,why:'을/를 marks the object of a verb.'},{correct:2,why:'Korean is typically subject–object–verb (SOV).'}][state.qIndex||0];let ok=i===q.correct;state.lastCorrect=ok;$('#answers').querySelectorAll('button').forEach((b,j)=>{b.disabled=true;if(j===q.correct)b.style.borderColor='#36845b'});$('#quizFeedback').innerHTML=`<div class="feedback">${ok?'🎉 Correct! 잘했어요!':'Not quite — keep going!'}<br>${q.why}</div>`;$('#nextQ').disabled=false};
window.nextQuestion=()=>{if(state.lastCorrect)state.quizCorrect++;state.quizAttempts++;if((state.qIndex||0)<2){state.qIndex=(state.qIndex||0)+1;save();render()}else{state.history.unshift({type:'quiz',title:`Quiz: ${state.quizCorrect}/3 correct`,date:new Date().toLocaleDateString()});let score=state.quizCorrect;state.qIndex=0;state.quizCorrect=0;state.lastCorrect=false;save();$('#view').innerHTML=`<div class="eyebrow">QUIZ COMPLETE</div><h1>잘했어요!</h1><div class="hero"><h2>${score} / 3 correct</h2><p>Every attempt helps your Korean grow.</p><button class="btn light" onclick="go('learn')">Back to learning</button></div>`}};
function practice(){return `<div class="eyebrow">SPEAKING STUDIO</div><h1>Let's talk Korean.</h1><p>Practice a phrase, type a response, or use voice input if your browser supports it.</p><div class="card"><div class="row between"><b>Your tutor</b><span class="pill">BEGINNER · STANDARD</span></div><div class="chat" id="chat"><div class="bubble bot">안녕하세요! 저는 한국어 친구예요. 오늘 무엇을 연습하고 싶어요?<br><span class="small">Hello! I'm your Korean practice partner. What would you like to practice today?</span></div></div><div class="chatcontrols"><input id="chatInput" placeholder="Type a Korean sentence…"><button class="btn" onclick="sendChat()">Send</button></div><div class="row" style="margin-top:10px"><button class="btn ghost" onclick="startListening()">🎙 Speak</button><button class="btn ghost" onclick="speak('안녕하세요! 오늘 기분이 어때요?')">🔊 Hear Korean</button></div><p class="small">Prototype tutor: feedback uses starter patterns, not a full AI model. Voice recognition availability depends on your browser.</p></div><h2>Try saying</h2><div class="grid"><button class="tile" onclick="putPhrase('저는 초보예요.')"><strong>저는 초보예요.</strong><span class="muted">I'm a beginner.</span></button><button class="tile" onclick="putPhrase('제 이름은 ___예요.')"><strong>제 이름은 ___예요.</strong><span class="muted">My name is ___.</span></button></div>`}
window.putPhrase=t=>{$('#chatInput').value=t};
function sendChat(){let input=$('#chatInput'),t=input.value.trim();if(!t)return;let chat=$('#chat');chat.innerHTML+=`<div class="bubble user">${escapeHtml(t)}</div>`;let lower=t.replace(/\s/g,'');let reply='좋아요! 계속해 봐요. (Good effort! Keep going.)';if(lower.includes('안녕하세요'))reply='잘했어요! “안녕하세요” is a polite, natural greeting. Can you introduce yourself next?';else if(lower.includes('감사합니다'))reply='맞아요! “감사합니다” is a polite way to say thank you. 잘했어요!';else if(lower.includes('저는')&&lower.includes('예요'))reply='좋아요! “저는 …예요” is a useful polite introduction pattern. Your sentence is understandable.';else if(/[a-zA-Z]/.test(t))reply='Try writing that in Hangul if you can. You can also ask me for a translation.';else reply='I can see your Korean text. In this starter version I can check a few common patterns, but nuanced grammar feedback will arrive when we connect the AI tutor.';chat.innerHTML+=`<div class="bubble bot">${reply}</div>`;input.value='';chat.scrollTop=chat.scrollHeight}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function speak(t){if(!('speechSynthesis'in window)){toast('Speech playback is not supported in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.85;speechSynthesis.speak(u)}
function startListening(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Voice input is not supported here. Try a compatible browser.');return}let r=new SR();r.lang='ko-KR';r.interimResults=false;r.onresult=e=>{$('#chatInput').value=e.results[0][0].transcript};r.onerror=()=>toast('Could not hear that. Please try again.');r.start()}
function dialectPage(){return `<div class="eyebrow">REGIONAL KOREAN</div><h1>Explore the dialects</h1><p>Start with standard Korean, then learn how speech varies by region, generation and context.</p>${dialects.map((d,i)=>`<div class="card dialect"><span class="emoji">${d[3]}</span><div><b>${d[0]}</b><div class="muted">${d[1]} · ${d[2]}</div><p>${d[4]}</p></div><span class="pill">${i===0?'START':'EXPLORE'}</span></div>`).join('')}<div class="feedback">Dialect note: regional speech is diverse and changes by town, age and situation. Jeju language (제주어) is especially distinct and is often discussed separately from mainland dialects.</div>`}
function profile(){return `<div class="eyebrow">YOUR LEARNING PROFILE</div><h1>My progress</h1><div class="grid"><div class="card"><div class="muted">Lessons completed</div><h2>${state.done.length}</h2></div><div class="card"><div class="muted">Experience points</div><h2>${state.xp} XP</h2></div><div class="card"><div class="muted">Quiz attempts</div><h2>${state.quizAttempts}</h2></div><div class="card"><div class="muted">Current streak</div><h2>🔥 ${state.streak} day</h2></div></div><h2>Tutor preferences</h2><div class="card"><div class="setting"><label>Correction style</label><br><select onchange="setPref('correction',this.value)"><option value="after" ${state.correction==='after'?'selected':''}>Correct after I finish</option><option value="immediate" ${state.correction==='immediate'?'selected':''}>Correct immediately</option><option value="both" ${state.correction==='both'?'selected':''}>Use judgment</option></select></div><div class="setting"><label>Tutor personality</label><br><select onchange="setPref('personality',this.value)"><option value="friendly">Friendly companion</option><option value="teacher">Patient teacher</option><option value="native">Natural conversation partner</option><option value="strict">Strict coach</option></select></div><div class="setting"><label>English support</label><br><select onchange="setPref('english',this.value)"><option value="adaptive">Gradually increase Korean</option><option value="english">Explain in English</option><option value="immersion">Korean immersion</option></select></div><button class="btn ghost" style="margin-top:15px" onclick="if(confirm('Clear all locally saved progress?')){localStorage.removeItem('kc-state');location.reload()}">Reset learning data</button></div><p class="small">Your progress is stored locally in this browser. Clearing browser data may erase it. Cloud sync is not connected yet.</p>`}
function setPref(k,v){state[k]=v;save();toast('Preference saved')}
function render(){let v=$('#view');if(state.tab==='home')v.innerHTML=home();if(state.tab==='learn')v.innerHTML=learn();if(state.tab==='practice')v.innerHTML=practice();if(state.tab==='dialects')v.innerHTML=dialectPage();if(state.tab==='profile')v.innerHTML=profile()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
render();
if('serviceWorker'in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
